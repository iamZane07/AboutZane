<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AboutZane - Demo</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --bg-trans: rgba(255, 255, 255, 0.8);
    --text: #1d1d1f;
    --text-body: #424245;
    --text-secondary: #6e6e73;
    --pink: #c48a8f;          /* 主色：低饱和淡粉 */
    --pink-soft: #f6ecec;     /* 浅粉底色 */
    --card: #fafafa;
    --border: #ececec;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #161617;
    --bg-trans: rgba(22, 22, 23, 0.8);
    --text: #f5f5f7;
    --text-body: #d6d6d9;
    --text-secondary: #a1a1a6;
    --pink: #d8a2a8;
    --pink-soft: #2a2021;
    --card: #1d1d1f;
    --border: #2c2c2e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text-body);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
                 "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans SC", sans-serif;
    font-size: 17px;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  .layout {
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr);
    gap: 56px;
    max-width: 1060px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* 侧边栏：sticky 定位；目录超出可视区域时在内部独立滚动 */
  .sidebar {
    position: sticky;
    top: 24px;
    align-self: start;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 48px);
    padding: 56px 0 32px;
  }
  .side-brand {
    margin-bottom: 18px;
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
  }
  .side-nav {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .side-nav::-webkit-scrollbar { width: 4px; }
  .side-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .side-nav a {
    display: flex;
    gap: 10px;
    padding: 7px 10px;
    margin-left: -10px;
    border-radius: 8px;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.5;
  }
  .side-nav a:hover { color: var(--text); background: var(--card); }
  .side-nav .n { padding-top: 2px; color: var(--pink); font-size: 12px; }
  .side-nav .subs { display: flex; flex-direction: column; margin: 2px 0 8px; }
  .side-nav .subs a {
    margin: 0 0 0 14px;
    padding: 4px 10px;
    border-left: 1px solid var(--border);
    border-radius: 0 8px 8px 0;
    font-size: 13px;
  }
  .side-nav .subs a:hover { background: none; color: var(--text); border-left-color: var(--pink); }
  .side-nav a.active { color: var(--text); }
  .side-nav .subs a.active { color: var(--pink); border-left-color: var(--pink); }
  .l1row { display: flex; align-items: center; }
  .l1row > a { flex: 1; }
  .sub-toggle { display: none; }
  .icon-btn.theme-float { display: none; position: fixed; top: 28px; right: 28px; z-index: 15; }
  @media (min-width: 881px) { .icon-btn.theme-float { display: inline-flex; } }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--bg);
    color: var(--text-body);
    cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--pink); color: var(--pink); }

  /* 手机端顶栏与抽屉 */
  .topbar {
    display: none;
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 20;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: var(--bg-trans);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .menu-btn { width: auto; gap: 8px; padding: 0 12px; border-radius: 10px; font-size: 14px; }
  .backdrop { display: none; }

  /* 头部 */
  .hero { padding: 110px 24px 70px; text-align: center; }
  .overline {
    color: var(--pink);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .hero h1 {
    margin: 14px 0 18px;
    color: var(--text);
    font-size: clamp(40px, 8vw, 64px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .subtitle { color: var(--text-secondary); font-size: 19px; }
  .avatar {
    display: block;
    width: 96px;
    height: 96px;
    margin: 0 auto 28px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--pink-soft);
    box-shadow: 0 0 0 1px var(--border);
  }

  /* 章节 */
  section { padding: 44px 0; border-top: 1px solid var(--border); scroll-margin-top: 24px; }
  .sec-head { margin-bottom: 28px; }
  .sec-no {
    color: var(--pink);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.15em;
  }
  h2 {
    margin-top: 6px;
    color: var(--text);
    font-size: clamp(26px, 5vw, 36px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }
  h3 {
    margin: 32px 0 12px;
    color: var(--text);
    font-size: 20px;
    font-weight: 600;
    scroll-margin-top: 24px;
  }
  p { margin: 12px 0; }

  a {
    color: var(--pink);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  a:hover { border-bottom-color: var(--pink); }

  s { color: var(--text-secondary); }

  .quote {
    margin: 16px 0;
    padding: 2px 0 2px 16px;
    border-left: 3px solid var(--pink);
    color: var(--text-secondary);
  }

  ul, ol { margin: 12px 0; padding-left: 22px; }
  li { margin: 6px 0; }
  li::marker { color: var(--pink); }

  hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }

  /* 基本信息键值对 */
  .kv { list-style: none; padding: 0; }
  .kv li {
    display: flex;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    margin: 0;
  }
  .kv .k {
    flex: 0 0 72px;
    color: var(--pink);
    font-weight: 600;
  }

  /* 爱好卡片 */
  .card {
    margin: 20px 0;
    padding: 28px;
    background: var(--card);
    border-radius: 20px;
  }
  .card h3 { margin: 0 0 8px; }
  .card .emoji { margin-right: 8px; }

  /* 图片区：新增图片只需在 content.md 的 gallery 里加一行 */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .photo img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 14px;
    background: var(--pink-soft);
    display: block;
  }
  .photo figcaption { margin-top: 10px; font-size: 14px; line-height: 1.6; }
  .photo figcaption strong { color: var(--text); font-size: 15px; margin-right: 8px; }
  .photo figcaption span { color: var(--text-secondary); }

  .sign {
    margin-top: 28px;
    color: var(--pink);
    font-weight: 600;
    text-align: right;
  }

  footer {
    padding: 56px 24px 72px;
    border-top: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 14px;
    text-align: center;
  }

  /* 入场动画：进入视口时轻柔淡入上浮 */
  @media (prefers-reduced-motion: no-preference) {
    .reveal {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.show { opacity: 1; transform: none; }
  }

  @media (max-width: 880px) {
    .topbar { display: flex; }
    .layout { display: block; padding: 0; }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      align-self: stretch;
      z-index: 30;
      width: min(300px, 82vw);
      padding: 76px 24px 28px;
      background: var(--bg);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      max-height: none;
      transform: translateX(-105%);
      transition: transform 0.25s ease;
    }
    .side-nav { overflow: visible; }
    body.nav-open .sidebar { transform: none; }
    .backdrop {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 25;
      background: rgba(0, 0, 0, 0.32);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    body.nav-open .backdrop { opacity: 1; pointer-events: auto; }
    .sub-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      margin-right: -6px;
      border: 0;
      border-radius: 8px;
      background: none;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .sub-toggle svg { transition: transform 0.2s ease; }
    .nav-group.open .sub-toggle svg { transform: rotate(90deg); }
    .nav-group .subs { display: none; }
    .nav-group.open .subs { display: flex; }
    section, h3 { scroll-margin-top: 64px; }
  }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    .hero { padding: 104px 20px 50px; }
    .card { padding: 22px; }
    .kv li { flex-direction: column; gap: 2px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开目录" aria-expanded="false">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    目录
  </button>
  <button class="icon-btn theme-toggle" aria-label="切换深浅色"></button>
</header>
<div class="backdrop" id="backdrop"></div>
<button class="icon-btn theme-toggle theme-float" aria-label="切换深浅色"></button>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <p class="side-brand"></p>
    <nav class="side-nav" id="sideNav" aria-label="目录"></nav>
  </aside>
  <main class="wrap" id="app">
    <noscript>
      <p style="padding: 80px 24px; text-align: center">
        本站内容由 Markdown 动态渲染，请在浏览器中启用 JavaScript 后查看。
      </p>
    </noscript>
  </main>
</div>

<!--
  页面内容全部来自 content.md，改内容只需要编辑那个文件。
  下面这些脚本只负责「解析 / 渲染 / 目录 / 主题」，平时不需要动。
-->
<script src="js/markdown.js"></script>
<script src="js/render.js"></script>
<script src="js/toc.js"></script>
<script src="js/theme.js"></script>
<script src="js/app.js"></script>

</body>
</html>
